name: Procesar fotos

on:
  push:
    branches: [main]
    paths:
      - "fotos/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: pip install pillow

      - name: Procesar las fotos
        run: python3 scripts/procesar-fotos.py

      - name: Guardar los cambios en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs plan
          if git diff --cached --quiet; then
            echo "No hay cambios"
          else
            git commit -m "Procesa las fotos nuevas"
            git push
          fi

      - name: Publicar en GitHub Pages
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
